services:
  db:
    image: pgvector/pgvector:pg16
    container_name: lenny_postgres

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lenny_dev_password
      POSTGRES_DB: lenny_assistant

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lenny_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: lenny_backend

    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:lenny_dev_password@db:5432/lenny_assistant
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: llama3.2:3b
      DEFAULT_LLM_PROVIDER: ollama
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: gpt-4o-mini

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: lenny_frontend

    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

    ports:
      - "3000:3000"

    depends_on:
      - backend

volumes:
  postgres_data: